<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Consolidado (sebo)</title>
<style>
:root{
  --paper:#DFE0E4; --card:#FFFFFF; --ink:#23242B; --mute:#6B6D78; --line:#C4C6D0;
  --azul:#1E1E7B; --bio:#2F9E44; --flora:#0B5C86; --sebo:#7A7D88;
  --pos:#0F7B40; --neg:#C31419; --posbg:#EAF6EF; --negbg:#FDEDEE;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:23px;margin:0;letter-spacing:-.2px}
.sub{font-size:13.5px;color:var(--mute);margin:3px 0 0}
.spacer{flex:1}
.volta{font-size:13px;color:var(--azul);text-decoration:none;font-weight:600}
.volta:hover{text-decoration:underline}
select{font-family:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);color:var(--ink)}
.modo{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.modobtn{font-family:inherit;font-size:13.5px;padding:8px 14px;border:0;background:var(--card);
  color:var(--ink);cursor:pointer}
.modobtn+.modobtn{border-left:1px solid var(--line)}
.modobtn.ativo{background:var(--azul);color:#fff}
hr{border:0;border-top:1px solid var(--line);margin:16px 0 20px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-bottom:22px}
.c{background:var(--card);padding:16px 18px}
.c .lab{font-size:13px;color:var(--mute)}
.c .big{font-size:27px;font-weight:600;margin:5px 0 2px;letter-spacing:-.5px}
.c .pe{font-size:12.5px;color:var(--mute)}
.big.pos{color:var(--pos)} .big.neg{color:var(--neg)}

h2{font-size:15px;margin:26px 0 4px;font-weight:600}
.nota{font-size:12.5px;color:var(--mute);margin:0 0 12px;line-height:1.5}

table{width:100%;border-collapse:collapse;background:var(--card);
  border:1px solid var(--line);font-size:13.5px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);
  white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);
  font-weight:600;background:#F4F5F8}
th:first-child,td:first-child{text-align:left;white-space:normal}
tbody tr:last-child td{border-bottom:0}
.g{border-left:1px solid var(--line)}
.pos{color:var(--pos);font-weight:600}
.neg{color:var(--neg);font-weight:600}
.zero td{color:var(--mute)}
.selo{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.s-bio{background:var(--bio)} .s-flo{background:var(--flora)} .s-ter{background:var(--sebo)}
tfoot td{font-weight:600;background:#F4F5F8;border-top:1px solid var(--line)}

.aviso{background:var(--card);border-left:3px solid var(--azul);padding:12px 15px;
  font-size:13.5px;margin:14px 0;line-height:1.55}
.vazio{background:var(--card);border:1px solid var(--line);padding:34px;
  text-align:center;color:var(--mute);font-size:14px}
.carregando{color:var(--mute);font-size:14px;padding:30px 0}

.fab{background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.fab .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--line);background:#F8F9FB}
.fab .nome{font-size:15px;font-weight:600}
.fab .veredito{margin-left:auto;font-size:13.5px;font-weight:600;text-align:right}
.fab .frase{padding:12px 16px 4px;font-size:13.5px;line-height:1.55}
.cab{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--mute);font-weight:600;margin-bottom:8px}
.lin{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:2px 0}
.lin span:first-child{color:var(--mute)}
.lin.forte{font-weight:600;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.lin.sec{font-size:11.5px;color:var(--mute)}
.lin.sec span:first-child{color:var(--mute)}
.semcomp{font-size:11.5px;color:var(--mute);padding:2px 0}
.fab.sem{opacity:.62}
.hide{display:none!important}
/* "O que foi feito" em destaque, largura toda, numeros maiores que o
   padrao — e o que realmente aconteceu, o que importa primeiro. "O que o
   modelo mandava" (.modelo, mais abaixo) fica do tamanho normal, atras do
   link recolhido: informacao de apoio, nao a principal. */
.feito{padding:14px 16px;border-top:1px solid var(--line);margin-top:10px}
.feito .cab{font-size:12px}
.feito .lin{font-size:15px;padding:4px 0}
.feito .lin.forte{font-size:19px;font-weight:700}
.feito .lin.sec{font-size:12.5px}
.feito .semcomp{font-size:12.5px}
.togglemodelo{display:block;width:100%;background:none;border:none;
  border-top:1px solid var(--line);cursor:pointer;padding:10px 16px;font-size:13px;
  color:var(--azul);text-align:left;font:inherit}
.togglemodelo:hover{text-decoration:underline}
.togglemodelo::before{content:'▸ ';color:var(--mute);text-decoration:none;display:inline-block}
.togglemodelo[aria-expanded="true"]::before{content:'▾ '}
.motivozero{color:var(--mute);font-weight:400}
.modelo{padding:12px 16px;border-top:1px solid var(--line);background:#F8F9FB}
.avisoPacote{background:var(--card);border-left:3px solid var(--sebo);padding:10px 15px;
  font-size:12.5px;color:var(--mute);margin:0 0 14px;line-height:1.5}
.resumo{background:var(--card);border:1px solid var(--line);padding:14px 16px;
  font-size:13.5px;line-height:1.6;margin-bottom:14px}
@media(max-width:640px){
  .feito .lin.forte{font-size:17px}
}
.excluir{background:none;border:0;color:var(--mute);font-size:12px;
  text-decoration:underline;cursor:pointer;padding:0}
.excluir:hover{color:var(--neg)}
.abrir{background:none;border:0;color:var(--azul);font-size:12px;
  text-decoration:underline;cursor:pointer;padding:0;margin-right:12px}
.abrir:hover{color:#16165C}
@media(max-width:700px){
  .wrap{padding:16px 12px 50px}
  table{font-size:12.5px} th,td{padding:8px 9px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>Consolidado</h1>
    <p class="sub" id="sub">Carregando…</p>
  </div>
  <div class="spacer"></div>
  <div class="modo" role="group" aria-label="Modo do consolidado">
    <button type="button" class="modobtn" data-modo="semana">Semana</button>
    <button type="button" class="modobtn" data-modo="mes">Mês</button>
  </div>
  <select id="periodo" aria-label="Período"></select>
</header>
<hr>

<div id="conteudo"><p class="carregando">Carregando…</p></div>

</div>
<script>
const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const n1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 1 });
const num = v => (v == null || v === '') ? null : Number(v);
const ton = v => v == null ? '-' : n1.format(v) + ' t';
// negativo sai como −R$ 1.234, nao R$ -1.234
const rs  = v => v == null ? '-'
  : (v < 0 ? '−R$ ' : 'R$ ') + nf.format(Math.abs(v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
// sebo_sujo e escrito pelo painel (ui.js) a cada mudanca de RASCUNHO_SUJO —
// mesma origem (localStorage), da pra saber daqui se ha edicao pendente la.
function estaSujo() {
  try { return localStorage.getItem('sebo_sujo') === '1'; } catch (e) { return false; }
}
// Dentro do iframe do painel, navegar tem que trocar a pagina inteira, nao
// so o conteudo do iframe. Aberta direto (sem casca), window.top e a
// propria janela, entao o efeito e o mesmo de location.href.
function navTopo(url) { window.top.location.href = url; }
// Sessao caiu enquanto a pagina estava aberta dentro do iframe: manda o
// painel inteiro pro login, nao so o iframe.
function sessaoExpirada(r) {
  if (r.status === 401) { navTopo('/entrar'); return true; }
  return false;
}

function selo(cli) {
  if (/biopower/i.test(cli)) return '<span class="selo s-bio"></span>';
  if (/flora/i.test(cli)) return '<span class="selo s-flo"></span>';
  return '<span class="selo s-ter"></span>';
}
// terMed/nTer: media entre terceiros da mesma sigla, base da Diferenca.
// terMelhor: so informativo, fora da conta (o antigo "Melhor terceiro").
// tonSemComp/origensSemComp: volume (e as origens responsaveis) sem nenhum
// terceiro pra comparar. Essa tonelada ja entrou no Volume e no NET medio
// acima (nao foi descontada dali) — so fica fora da Diferenca, que so soma
// onde houve media de terceiro pra comparar.
function bloco(cab, t, net, terMed, nTer, terMelhor, tonSemComp, origensSemComp, sav) {
  const f = v => v == null ? '-' : rs(v);
  let o = '<div><div class="cab">' + cab + '</div>';
  o += '<div class="lin"><span>Volume</span><span>' + (t > 0 ? ton(t) : '-') + '</span></div>';
  o += '<div class="lin"><span>NET médio</span><span>' + f(net) + '</span></div>';
  o += '<div class="lin"><span>Média terceiros</span><span>' + f(terMed) +
    (terMed != null && nTer > 0
      ? ' · média de ' + Math.round(nTer) + (Math.round(nTer) === 1 ? ' oferta' : ' ofertas')
      : '') + '</span></div>';
  if (tonSemComp > 0.01) {
    o += '<div class="semcomp">' + ton(tonSemComp) + ' sem oferta de terceiro' +
      (origensSemComp && origensSemComp.length
        ? ' (origens: ' + origensSemComp.map(esc).join(', ') + ')' : '') + '</div>';
  }
  o += '<div class="lin sec"><span>Melhor terceiro</span><span>' + f(terMelhor) + '</span></div>';
  o += '<div class="lin forte"><span>Diferença</span><span class="' +
    (sav == null ? '' : (sav < 0 ? 'neg' : 'pos')) + '">' +
    (sav == null ? '-' : (sav > 0 ? '+' : '') + rs(sav)) + '</span></div>';
  return o + '</div>';
}
function sinal(v) {
  if (v == null) return '<td>-</td>';
  return '<td class="' + (v < 0 ? 'neg' : 'pos') + '">' +
    (v > 0 ? '+' : '') + rs(v) + '</td>';
}
const fmtDataHora = iso => new Date(iso).toLocaleString('pt-BR',
  { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

function nomeMes(m) {
  const [a, b] = m.split('-');
  const M = ['janeiro','fevereiro','março','abril','maio','junho','julho',
    'agosto','setembro','outubro','novembro','dezembro'];
  return M[Number(b) - 1] + ' de ' + a;
}
function nomeSemana(v) {
  const [a, s] = v.split('-');
  return 'semana ' + Number(s) + '/' + a;
}
function subtitulo(j) {
  if (j.modo === 'semana') {
    return nomeSemana(j.ano + '-' + j.semana) + ' · apurado pela semana fechada, não pela data de embarque';
  }
  return nomeMes(j.mes) + ' · apurado pela data de embarque de cada carga';
}

let modo = 'mes';

function marcarModo(m) {
  [].forEach.call(document.querySelectorAll('.modobtn'), b =>
    b.classList.toggle('ativo', b.dataset.modo === m));
}

// Preenche o seletor de periodo conforme o modo e devolve o valor default
// (o mais recente). null quando nao ha nada fechado naquele modo.
async function popularPeriodo(m) {
  const sel = $('#periodo');
  if (m === 'semana') {
    const r = await fetch('/api/semanas');
    if (sessaoExpirada(r)) return null;
    const j = await r.json();
    if (!j.length) { sel.innerHTML = ''; return null; }
    sel.innerHTML = j.map(s => {
      const v = s.ano + '-' + s.semana;
      return '<option value="' + v + '">' + nomeSemana(v) +
        (s.periodo ? ' (' + esc(s.periodo) + ')' : '') + '</option>';
    }).join('');
    return sel.options[0].value;
  }
  const r = await fetch('/api/meses');
  if (sessaoExpirada(r)) return null;
  const j = await r.json();
  if (!j.length) { sel.innerHTML = ''; return null; }
  sel.innerHTML = j.map(x =>
    '<option value="' + x.mes + '">' + nomeMes(x.mes) + '</option>').join('');
  return sel.options[0].value;
}

function atualizarUrl(m, valor) {
  const url = new URL(location.href);
  url.search = '';
  if (valor) url.searchParams.set(m, valor);
  history.replaceState(null, '', url.pathname + url.search);
}

// Troca de modo: repopula o seletor de periodo; usa valorPreferido se ele
// ainda existir na lista nova (ex.: veio da URL no boot), senao cai no
// mais recente.
async function trocarModo(m, valorPreferido) {
  modo = m;
  marcarModo(m);
  const padrao = await popularPeriodo(m);
  const sel = $('#periodo');
  const opcoes = [].map.call(sel.options, o => o.value);
  const usar = (valorPreferido && opcoes.indexOf(valorPreferido) !== -1) ? valorPreferido : padrao;
  if (!usar) { modoVazio(); return; }
  sel.value = usar;
  carregar();
}

function modoVazio() {
  $('#sub').textContent = modo === 'semana' ? 'nenhuma semana fechada ainda' : 'nenhum mês com dado ainda';
  $('#conteudo').innerHTML = '<div class="vazio">Nenhuma semana fechada ainda.<br>' +
    'Feche a primeira semana no painel para o consolidado começar a existir.</div>';
}

function render(d) {
  const cont = $('#conteudo');
  const props = d.porPropria || [];
  const semanas = d.semanasFechadas || [];
  const temDado = props.some(p => Number(p.ton_realizado) > 0);
  // Sem dado nenhum (nem própria, nem semana fechada pra gerenciar): so ai
  // que o mes esta realmente vazio. Uma semana fechada por engano, sem
  // volume proprio, ainda precisa aparecer — e o caso que mais importa pra
  // conseguir excluir.
  if (!temDado && !semanas.length) {
    cont.innerHTML = '<div class="vazio">' +
      (d.modo === 'semana' ? 'Nenhum dado nesta semana ainda.' : 'Nenhuma semana fechada neste mês ainda.') +
      '<br>O consolidado passa a mostrar dado depois que você fechar a primeira semana.</div>';
    return;
  }

  let h = '';
  if (temDado) {
  // Totais. O saving so existe onde havia alternativa de terceiro para comparar.
  let savR = 0, savO = 0, temSavO = false;
  props.forEach(p => {
    if (num(p.saving_realizado) != null) savR += num(p.saving_realizado);
    if (num(p.saving_otimo) != null) { savO += num(p.saving_otimo); temSavO = true; }
  });
  const tot = d.total || {};
  const tProp = props.reduce((s, p) => s + Number(p.ton_realizado || 0), 0);
  const tTudo = Number(tot.toneladas || 0);
  const tTer = tTudo - tProp;
  const perdido = temSavO ? (savO - savR) : null;

  h += '<div class="cards">';
  h += '<div class="c"><div class="lab">' +
       (d.modo === 'semana' ? 'Volume da semana' : 'Volume do mês') + '</div><div class="big">' +
       ton(tTudo) + '</div><div class="pe">' +
       (d.modo === 'semana' ? '&nbsp;' : (tot.semanas || 0) + ' semana(s) fechada(s)') + '</div></div>';
  h += '<div class="c"><div class="lab">Para fábrica própria</div><div class="big">' +
       ton(tProp) + '</div><div class="pe">' +
       (tTudo ? n1.format(tProp / tTudo * 100) + '% do total' : '-') + '</div></div>';
  h += '<div class="c"><div class="lab">Para terceiros</div><div class="big">' +
       ton(tTer) + '</div><div class="pe">NET médio geral ' +
       rs(num(tot.net_medio)) + '</div></div>';
  h += '<div class="c"><div class="lab">Ganho sobre o mercado</div><div class="big ' +
       (savR < 0 ? 'neg' : 'pos') + '">' + (savR > 0 ? '+' : '') + rs(savR) +
       '</div><div class="pe">realizado, nas cargas que foram para própria</div></div>';
  h += '</div>';

  if (perdido != null && Math.abs(perdido) > 1) {
    h += '<div class="aviso"><b>' + rs(Math.abs(perdido)) + '</b> ' +
      (perdido > 0
        ? 'é a diferença entre o que a alocação do modelo geraria e o que foi feito. ' +
          'Vem das trocas manuais de destino durante a semana.'
        : 'foi ganho acima do que o modelo indicava, por trocas feitas na mão.') +
      '</div>';
  }

  // Semana(s) fechada(s) antes de net_ter_med existir (sem o pacote com
  // Programação e Mapa guardado) nunca entram na comparação de ganho: nao
  // ha como recalcular sem migrarNetTerMedio() ter o que precisa.
  const semPacote = semanas.filter(s => s.tem_pacote === false);
  if (semPacote.length) {
    h += '<div class="avisoPacote">' +
      (d.modo === 'semana'
        ? 'Esta semana está sem média de terceiros: reabra e feche com as planilhas para recalcular.'
        : semPacote.length + ' de ' + semanas.length + ' semana(s) deste período estão sem média ' +
          'de terceiros e ficaram fora do Ganho sobre o mercado. Reabra e feche cada uma com as ' +
          'planilhas para recalcular.') +
      '</div>';
  }

  h += '<h2>Fábricas próprias</h2>';
  h += '<p class="nota">Para cada carga que foi para uma fábrica própria, o painel compara ' +
    'com a média do NET entre os terceiros que ofertaram para <b>a mesma origem</b>, na mesma ' +
    'semana. A diferença entre as duas é o que a decisão valeu. Aqui isso aparece duas vezes: ' +
    'no que foi feito, e no que o modelo mandava fazer antes de qualquer troca manual.</p>';

  // Sem planilhas guardadas (ver avisoPacote acima), nenhuma carga da(s)
  // semana(s) em tela tem media pra comparar — usado pra distinguir esse
  // motivo do outro caso de "sem comparacao" (o modelo simplesmente nao
  // mandou carga pra aquela fabrica).
  const semPacotePeriodo = semanas.some(s => s.tem_pacote === false);

  props.forEach((p, i) => {
    const tr = Number(p.ton_realizado || 0), to = Number(p.ton_otimo || 0);
    const sr = num(p.saving_realizado), so = num(p.saving_otimo);
    // O selo (Diferenca entre os dois cenarios) so faz sentido quando os
    // DOIS lados tem uma comparacao de verdade — comparar com zero quando
    // um dos dois nao tem dado (ex.: o modelo nao mandou carga nenhuma pra
    // ca) confundia "sem comparacao" com "empatou com o mercado".
    const temComparacao = sr != null && so != null;
    const dif = temComparacao ? so - sr : null;

    // A frase sempre descreve os volumes de verdade, comparacao existindo
    // ou nao — so o selo (o resumo em uma linha) e que fica em duvida.
    // motivo_zero_otimo vem pronto do servidor (db.js:preencherMotivosZeroOtimo,
    // usa a mesma logica de src/core.js:motivoModeloZero que a tela ao vivo
    // usa) — so existe no modo Semana e quando a semana tem pacote guardado;
    // fora disso fica null e a frase mostra so o fato, sem arriscar o motivo.
    const motivoZero = to === 0 ? p.motivo_zero_otimo : null;
    let veredito, frase;
    if (tr === 0 && to === 0) {
      veredito = '<span style="color:var(--mute)">não entrou na semana</span>';
      frase = 'Não recebeu carga, e o modelo também não mandaria nada para cá' +
        (motivoZero ? ' ' + motivoZero : '.');
    } else {
      if (tr === 0) {
        frase = 'Não recebeu nada. O modelo mandaria <b>' + ton(to) + '</b> para cá.';
      } else if (to === 0) {
        frase = 'Recebeu <b>' + ton(tr) + '</b>, mas o modelo não mandaria nada para cá' +
          (motivoZero ? ' ' + motivoZero : '.');
      } else {
        const d = to - tr;
        frase = 'Recebeu <b>' + ton(tr) + '</b>; o modelo mandaria <b>' + ton(to) + '</b>' +
          (Math.abs(d) < 0.5 ? ', o mesmo volume.'
            : (d > 0 ? ', <b>' + ton(d) + '</b> a mais do que recebeu.'
                     : ', <b>' + ton(-d) + '</b> a menos do que recebeu.'));
      }
      if (!temComparacao) {
        // O selo diz o motivo em vez de um generico "sem comparacao": o
        // modelo nao indicou (to===0), a fabrica nao recebeu nada (tr===0),
        // ou (com os dois lados com volume) faltou dado pra comparar —
        // semana sem planilhas guardadas, ou planilhas guardadas mas
        // nenhuma oferta de terceiro pra aquela origem.
        const motivo = to === 0 ? 'o modelo não indicou esta fábrica'
          : tr === 0 ? 'esta fábrica não recebeu carga'
          : (semPacotePeriodo ? 'sem planilhas para comparar' : 'sem oferta de terceiro para comparar');
        veredito = '<span style="color:var(--mute)">' + motivo + '</span>';
        if (to !== 0 && tr !== 0) {
          frase += ' ' + (semPacotePeriodo
            ? 'Semana sem planilhas guardadas: não dá para calcular a comparação com o mercado.'
            : 'Nenhuma das cargas teve oferta de terceiro para comparar.');
        }
      } else {
        veredito = Math.abs(dif) < 1 ? '<span class="pos">no ponto</span>'
          : (dif > 0 ? '<span class="neg">' + rs(dif) + ' abaixo do modelo</span>'
                     : '<span class="pos">+' + rs(-dif) + ' acima do modelo</span>');
      }
    }

    // "O que foi feito" em destaque, largura toda; "O que o modelo mandava"
    // recolhido atras de um link discreto, com o motivo do zero (quando
    // existe) direto no link, sem precisar abrir pra ler.
    const linkTxt = 'ver o que o modelo mandava' +
      (motivoZero ? ' <span class="motivozero">(' + motivoZero.replace(/\.$/, '') + ')</span>' : '');
    h += '<div class="fab' + (tr === 0 && to === 0 ? ' sem' : '') + '">';
    h += '<div class="top"><span class="nome">' + selo(p.cliente) + esc(p.cliente) +
      '</span><span class="veredito">' + veredito + '</span></div>';
    h += '<div class="frase">' + frase + '</div>';
    h += '<div class="feito">';
    h += bloco('O que foi feito', tr, num(p.net_realizado), num(p.net_ter_realizado),
      num(p.n_ter_realizado), num(p.net_ter_melhor_realizado), tr - Number(p.ton_comp_realizado || 0),
      p.origens_sem_comp_realizado, sr);
    h += '</div>';
    h += '<button type="button" class="togglemodelo" data-alvo="modelo-' + i + '" aria-expanded="false">' +
      linkTxt + '</button>';
    h += '<div class="modelo hide" id="modelo-' + i + '">';
    h += bloco('O que o modelo mandava', to, num(p.net_otimo), num(p.net_ter_otimo),
      num(p.n_ter_otimo), num(p.net_ter_melhor_otimo), to - Number(p.ton_comp_otimo || 0),
      p.origens_sem_comp_otimo, so);
    h += '</div></div>';
  });

  const totO = props.reduce((s2, p) => s2 + Number(p.ton_otimo || 0), 0);
  const prepPeriodo = d.modo === 'semana' ? 'Na semana' : 'No mês';
  h += '<div class="resumo">' + prepPeriodo + ', <b>' + ton(tProp) + '</b> foram para fábrica própria e ' +
    'renderam <b class="' + (savR < 0 ? 'neg' : 'pos') + '">' + (savR > 0 ? '+' : '') +
    rs(savR) + '</b> em relação ao que o mercado pagaria pelas mesmas cargas. ' +
    'A alocação do modelo mandaria <b>' + ton(totO) + '</b> e renderia <b class="pos">+' +
    rs(savO) + '</b>.</div>';

  // Terceiros num bloco so, como combinado.
  const ters = (d.porPlanta || []).filter(x => x.proprio === false);
  if (ters.length) {
    const tt = ters.reduce((s, x) => s + Number(x.toneladas || 0), 0);
    const netT = ters.reduce((s, x) =>
      s + Number(x.net_medio || 0) * Number(x.toneladas || 0), 0) / (tt || 1);
    h += '<h2>Terceiros</h2>';
    h += '<p class="nota">' + ters.length + ' cliente(s) ' +
      (d.modo === 'semana' ? 'na semana' : 'no mês') + ', somados. ' +
      'NET médio ponderado pelo volume.</p>';
    h += '<table><thead><tr><th>Destino</th><th>Volume</th><th>NET médio</th>' +
      '</tr></thead><tbody>';
    h += '<tr><td>' + selo('terceiro') + 'Terceiros (todos)</td><td>' + ton(tt) +
      '</td><td>' + rs(netT) + '</td></tr>';
    h += '</tbody></table>';
  }
  }

  if (semanas.length) {
    h += '<h2>' + (d.modo === 'semana' ? 'Semana selecionada' : 'Semanas fechadas neste mês') + '</h2>';
    h += '<p class="nota">Excluir apaga a semana inteira do banco: todas as versões,' +
      ' não só a mais recente. Não pode ser desfeito.</p>';
    h += '<table><thead><tr><th>Semana</th><th>Período</th><th>Modo</th><th>Versão</th>' +
      '<th>Linhas</th><th>Fechada por</th><th>Quando</th><th></th></tr></thead><tbody>';
    semanas.forEach(s => {
      const modoTxt = s.modo === 'mercado' ? 'Mercado livre'
        : s.modo === 'prioridade' ? 'Prioridade de volume' : '-';
      h += '<tr><td>' + s.semana + '/' + s.ano + '</td><td>' + esc(s.periodo || '-') + '</td>' +
        '<td>' + modoTxt + '</td>' +
        '<td>v' + s.versao + '</td><td>' + nf.format(s.linhas) + '</td>' +
        '<td>' + esc(s.fechada_por || '-') + '</td><td>' + fmtDataHora(s.fechada_em) + '</td>' +
        '<td><button class="abrir" data-ano="' + s.ano + '" data-semana="' + s.semana +
        '">abrir</button><button class="excluir" data-ano="' + s.ano + '" data-semana="' + s.semana +
        '" data-linhas="' + s.linhas + '" data-toneladas="' + Math.round(s.toneladas) +
        '">excluir</button></td></tr>';
    });
    h += '</tbody></table>';
  }

  cont.innerHTML = h;

  [].forEach.call(cont.querySelectorAll('.togglemodelo'), btn => {
    btn.onclick = () => {
      const alvo = document.getElementById(btn.dataset.alvo);
      if (!alvo) return;
      const abrir = alvo.classList.contains('hide');
      alvo.classList.toggle('hide', !abrir);
      btn.setAttribute('aria-expanded', abrir ? 'true' : 'false');
    };
  });

  [].forEach.call(cont.querySelectorAll('.abrir'), b => {
    b.onclick = () => {
      if (estaSujo() && !confirm(
        'Há alterações não salvas na semana em andamento no painel. Abrir esta semana mesmo assim?'
      )) return;
      navTopo('/?abrirSemana=' + b.dataset.ano + '-' + b.dataset.semana);
    };
  });

  [].forEach.call(cont.querySelectorAll('.excluir'), b => {
    b.onclick = async () => {
      const ano = b.dataset.ano, semana = b.dataset.semana;
      const ton = Number(b.dataset.toneladas), linhas = b.dataset.linhas;
      if (!confirm('Apagar a semana ' + semana + ' (' + nf.format(ton) + ' t, ' + linhas +
          ' linhas)? Isso não pode ser desfeito.')) return;
      const r = await fetch('/api/semanas?ano=' + ano + '&semana=' + semana, { method: 'DELETE' });
      if (sessaoExpirada(r)) return;
      if (!r.ok) { alert('Não consegui apagar essa semana.'); return; }
      // Apagou justo a semana escolhida no modo Semana: ela some da lista,
      // repopula e cai em outra semana valida — sem trocar de modo.
      if (modo === 'semana' && $('#periodo').value === ano + '-' + semana) {
        const proxima = await popularPeriodo('semana');
        if (!proxima) { modoVazio(); return; }
        $('#periodo').value = proxima;
      }
      carregar();
    };
  });
}

async function carregar() {
  const v = $('#periodo').value;
  if (!v) return;
  $('#conteudo').innerHTML = '<p class="carregando">Carregando…</p>';
  atualizarUrl(modo, v);
  try {
    const url = modo === 'semana'
      ? '/api/consolidado?semana=' + encodeURIComponent(v)
      : '/api/consolidado?mes=' + encodeURIComponent(v);
    const r = await fetch(url);
    if (sessaoExpirada(r)) return;
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro || 'Falha ao carregar.');
    $('#sub').textContent = subtitulo(j);
    render(j);
  } catch (e) {
    $('#conteudo').innerHTML = '<div class="vazio">' + esc(e.message) + '</div>';
  }
}

(async () => {
  [].forEach.call(document.querySelectorAll('.modobtn'), b => {
    b.onclick = () => trocarModo(b.dataset.modo);
  });
  $('#periodo').onchange = carregar;

  // O modo e o periodo iniciais vem da URL quando presentes (?semana=AAAA-SS
  // ou ?mes=AAAA-MM); senao, cai no modo Mes com o mais recente — o mesmo
  // comportamento de sempre.
  const params = new URLSearchParams(location.search);
  const modoInicial = params.has('semana') ? 'semana' : 'mes';
  const valorInicial = params.get(modoInicial);
  await trocarModo(modoInicial, valorInicial);
})();

// Aberta dentro do iframe do painel: avisa a propria altura toda vez que o
// conteudo muda de tamanho (troca de modo/periodo, carregamento, exclusao),
// pra secao do painel crescer junto e nunca precisar de rolagem propria.
// Aberta direto (sem casca), window.parent === window e nada disto roda.
if (window.parent !== window) {
  (function () {
    function enviarAltura() {
      window.parent.postMessage(
        { tipo: 'alturaFrame', secao: 'consolidado', altura: document.documentElement.scrollHeight },
        location.origin
      );
    }
    new ResizeObserver(enviarAltura).observe(document.body);
    window.addEventListener('load', enviarAltura);
  })();
}
</script>
</body>
</html>
