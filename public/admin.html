<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Painel de sebo: usuários</title>
<style>
:root{
  --paper:#ffffff; --tinta:#16181d; --fraco:#6b7280;
  --linha:#e3e5ea; --azul:#1e1e7b; --campo:#f7f8fa;
  --erro:#b42318; --bom:#0f7b40; --espera:#8a5a00;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--tinta);margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{background:var(--paper);min-height:100vh;max-width:820px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--linha);margin-bottom:20px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.quem{font-size:12.5px;color:var(--fraco)}
.links{display:flex;gap:8px}
.btn{padding:8px 13px;border:1px solid var(--linha);background:var(--paper);
  color:var(--tinta);border-radius:7px;font-size:13px;cursor:pointer;
  text-decoration:none;font-family:inherit;min-height:38px;display:inline-flex;
  align-items:center}
.btn.pri{background:var(--azul);color:#fff;border-color:var(--azul)}
h2{font-size:14px;margin:24px 0 10px;color:var(--fraco);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px}
.linha{border:1px solid var(--linha);border-radius:10px;padding:13px 15px;
  margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap}
.linha .nome{font-size:14.5px;font-weight:600}
.linha .mail{font-size:12.5px;color:var(--fraco);margin-top:2px}
.acoes{display:flex;gap:7px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.3px}
.tag.pendente{background:#fdf6e7;color:var(--espera)}
.tag.ativo{background:#eef8f2;color:var(--bom)}
.tag.bloqueado{background:#fdf1f0;color:var(--erro)}
.tag.excluido{background:#fdf1f0;color:var(--erro)}
.tag.master{background:#eeeef8;color:var(--azul)}
.tag.admin{background:#eeeef8;color:var(--azul)}
.vazio{color:var(--fraco);font-size:13.5px;padding:14px 0}
.aviso{padding:11px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.aviso.erro{background:#fdf1f0;color:var(--erro);border:1px solid #f5cfcb;display:block}
.aviso.bom{background:#eef8f2;color:var(--bom);border:1px solid #c6e6d5;display:block}
.ovl{position:fixed;inset:0;background:rgba(20,20,30,.45);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:50}
.ovl.on{display:flex}
.caixaSenha{background:var(--paper);border-radius:12px;padding:22px;max-width:380px;
  width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.caixaSenha h3{margin:0 0 8px;font-size:16px}
.caixaSenha p{font-size:13px;color:var(--fraco);margin:0 0 14px}
.caixaSenha .valor{font:600 17px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--campo);border:1px solid var(--linha);border-radius:8px;
  padding:10px 12px;margin-bottom:16px;word-break:break-all;user-select:all}
@media(max-width:520px){
  .linha{flex-direction:column;align-items:flex-start}
  .acoes{width:100%}
  .acoes .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Usuários</h1>
      <div class="quem" id="quem"></div>
    </div>
    <div class="links">
      <a class="btn" href="/">Ir ao painel</a>
      <button class="btn" id="btnSair">Sair</button>
    </div>
  </header>

  <div class="aviso" id="aviso"></div>

  <h2>Aguardando aprovação</h2>
  <div id="pendentes"></div>

  <h2>Com acesso</h2>
  <div id="ativos"></div>

  <h2>Bloqueados</h2>
  <div id="bloqueados"></div>

  <h2>Excluídos</h2>
  <div id="excluidos"></div>
</div>

<div class="ovl" id="ovlSenha">
  <div class="caixaSenha">
    <h3>Senha temporária gerada</h3>
    <p>Copie agora e repasse para <b id="ovlNome"></b>. Depois de fechar,
      esta senha não pode ser vista de novo.</p>
    <div class="valor" id="ovlValor"></div>
    <button class="btn pri" id="btnFecharSenha" style="width:100%">Fechar</button>
  </div>
</div>

<script>
var av = document.getElementById('aviso');

function diz(txt, tipo){
  av.textContent = txt;
  av.className = 'aviso ' + (tipo || 'erro');
  setTimeout(function(){ av.className = 'aviso'; }, 4000);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function data(v){
  if(!v) return '';
  var d = new Date(v);
  return d.toLocaleDateString('pt-BR') + ' ' +
         d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function monta(u){
  var ehMaster = u.papel === 'master';
  var souEu = u.id === MEU_ID;
  var bloco = '<div class="linha"><div>' +
    '<div class="nome">' + esc(u.nome) +
      ' <span class="tag ' + (ehMaster ? 'master' : esc(u.situacao)) + '">' +
      (ehMaster ? 'administrador' : esc(u.situacao)) + '</span>' +
      (u.papel === 'admin' ? ' <span class="tag admin">admin</span>' : '') +
    '</div>' +
    '<div class="mail">' + esc(u.email) + ' · pediu em ' + data(u.criado_em) + '</div>' +
    '</div>';

  if(ehMaster) return bloco + '</div>';

  // Excluido e estado terminal nesta tela: so tem volta, sem as outras acoes.
  if(u.situacao === 'excluido'){
    bloco += '<div class="acoes"><button class="btn pri" data-acao="aprovar" data-id="' + u.id + '">Reativar</button></div>';
    return bloco + '</div>';
  }

  bloco += '<div class="acoes">';
  if(u.situacao !== 'ativo'){
    bloco += '<button class="btn pri" data-acao="aprovar" data-id="' + u.id + '">Aprovar</button>';
  }
  if(u.situacao !== 'bloqueado'){
    bloco += '<button class="btn" data-acao="bloquear" data-id="' + u.id + '">Bloquear</button>';
  }
  if(u.papel !== 'admin'){
    bloco += '<button class="btn" data-acao="promover" data-id="' + u.id + '">Tornar admin</button>';
  } else if(!souEu){
    bloco += '<button class="btn" data-acao="rebaixar" data-id="' + u.id +
      '" data-nome="' + esc(u.nome) + '">Tirar admin</button>';
  }
  // Excluir, rebaixar e redefinir senha tirariam ou trocariam o proprio
  // acesso — escondidos na propria linha. Para a propria senha existe
  // "Trocar senha" no painel.
  if(!souEu){
    bloco += '<button class="btn" data-acao="redefinir-senha" data-id="' + u.id +
      '" data-nome="' + esc(u.nome) + '">Redefinir senha</button>';
    bloco += '<button class="btn" data-acao="excluir" data-id="' + u.id +
      '" data-nome="' + esc(u.nome) + '" data-email="' + esc(u.email) + '">Excluir</button>';
  }
  bloco += '</div>';
  return bloco + '</div>';
}

var MEU_ID = null;

async function carregar(){
  var r = await fetch('/api/eu');
  var e = await r.json();
  if(!e.usuario || (e.usuario.papel !== 'master' && e.usuario.papel !== 'admin')){
    location.href = '/entrar'; return;
  }
  MEU_ID = e.usuario.id;
  document.getElementById('quem').textContent = e.usuario.nome + ' · ' + e.usuario.email;

  var r2 = await fetch('/api/usuarios');
  if(!r2.ok){ diz('Não foi possível carregar a lista.'); return; }
  var lista = (await r2.json()).usuarios || [];

  var grupos = {pendente:[], ativo:[], bloqueado:[], excluido:[]};
  lista.forEach(function(u){ (grupos[u.situacao] || grupos.ativo).push(u); });

  function poe(id, arr, vazio){
    document.getElementById(id).innerHTML =
      arr.length ? arr.map(monta).join('') : '<div class="vazio">' + vazio + '</div>';
  }
  poe('pendentes',  grupos.pendente,  'Nenhum pedido no momento.');
  poe('ativos',     grupos.ativo,     'Ninguém com acesso ainda.');
  poe('bloqueados', grupos.bloqueado, 'Ninguém bloqueado.');
  poe('excluidos',  grupos.excluido,  'Ninguém excluído.');
}

document.addEventListener('click', async function(ev){
  var b = ev.target.closest('button[data-acao]');
  if(!b) return;
  var acao = b.dataset.acao;
  if(acao === 'excluir' && !confirm('Excluir ' + b.dataset.nome + ' (' + b.dataset.email +
      ')? A pessoa perde o acesso, mas o histórico dela (semanas fechadas, rascunhos) continua.')) return;
  if(acao === 'rebaixar' && !confirm('Tirar o admin de ' + b.dataset.nome + '?')) return;
  if(acao === 'redefinir-senha' && !confirm('Gerar uma senha temporária nova para ' +
      b.dataset.nome + '? A senha atual dela para de funcionar.')) return;
  b.disabled = true;
  var r = await fetch('/api/usuarios/' + b.dataset.id + '/' + acao, {method:'POST'});
  var d = await r.json();
  if(!r.ok){ diz(d.erro || 'Não foi possível concluir.'); b.disabled = false; return; }
  if(acao === 'redefinir-senha'){
    // So recarrega a lista depois do Fechar — recarregar agora redesenharia
    // a tela e derrubaria esta caixa antes da pessoa copiar a senha.
    document.getElementById('ovlNome').textContent = b.dataset.nome;
    document.getElementById('ovlValor').textContent = d.senha;
    document.getElementById('ovlSenha').className = 'ovl on';
    b.disabled = false;
    return;
  }
  var msgs = {
    aprovar: 'Acesso liberado.', bloquear: 'Acesso bloqueado.', excluir: 'Usuário excluído.',
    promover: 'Agora é admin.', rebaixar: 'Não é mais admin.'
  };
  diz(msgs[acao] || 'Concluído.', 'bom');
  carregar();
});

document.getElementById('btnFecharSenha').onclick = function(){
  document.getElementById('ovlSenha').className = 'ovl';
  document.getElementById('ovlValor').textContent = '';
  diz('Senha redefinida.', 'bom');
  carregar();
};

document.getElementById('btnSair').onclick = async function(){
  await fetch('/api/sair', {method:'POST'});
  location.href = '/entrar';
};

carregar();
</script>
</body>
</html>
