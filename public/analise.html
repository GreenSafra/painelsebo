<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Análise de cotações (sebo)</title>
<style>
:root{
  --paper:#DFE0E4; --card:#FFFFFF; --ink:#23242B; --mute:#6B6D78; --line:#C4C6D0;
  --azul:#1E1E7B; --pos:#0F7B40; --neg:#C31419; --posbg:#EAF6EF; --negbg:#FDEDEE;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1480px;margin:0 auto;padding:22px 20px 60px}
header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:23px;margin:0;letter-spacing:-.2px}
.sub{font-size:13.5px;color:var(--mute);margin:3px 0 0}
.spacer{flex:1}
.volta{font-size:13px;color:var(--azul);text-decoration:none;font-weight:600}
.volta:hover{text-decoration:underline}
input[type=week]{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);color:var(--ink)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0 20px}

.rank{display:flex;flex-direction:column;gap:8px}
.card{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:12px 16px;display:flex;align-items:center;gap:14px}
.card:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.card:hover{border-color:var(--azul);box-shadow:0 7px 22px rgba(30,30,123,.09);transform:translateY(-1px)}
.card{transition:box-shadow .2s,border-color .2s,transform .2s}
.card .pos{flex:none;width:32px;font-size:13px;font-weight:700;color:var(--mute);text-align:center}
.card:nth-child(1) .pos{color:var(--azul);font-size:15px}
.card .nome{flex:1;min-width:40px;font-size:14.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* sequencia de semanas: fica a direita, ao lado do selo de variacao. largura
   propria (flex:none) — se nao couber no celular, rola so este bloco (ver
   media query), nunca empurra o nome nem estoura o card. */
.card .semanas{flex:none;display:flex;gap:10px;overflow-x:auto}
.card .col{flex:none;width:60px;text-align:center}
.card .col .rot{font-size:10.5px;font-weight:600;color:var(--mute)}
.card .col .pr{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:1px}
.card .col .dif{font-size:10.5px;margin-top:1px;min-height:13px;font-variant-numeric:tabular-nums}
.card .col.atual .rot{color:var(--ink)}
.card .col.atual .pr{font-size:16px;font-weight:700;color:var(--ink)}
.card .dif.alta{color:var(--pos)}
.card .dif.baixa{color:var(--neg)}
.card .dif.igual{color:var(--mute)}
.card .var{flex:none;width:84px;text-align:center;font-size:12.5px;font-weight:700;
  padding:4px 0;border-radius:20px}
.card .var.alta{background:var(--posbg);color:var(--pos)}
.card .var.baixa{background:var(--negbg);color:var(--neg)}
.card .var.igual{background:#EEEFF2;color:var(--mute)}
.card .var.ausente{background:transparent;color:var(--line);font-weight:400}

/* Gráficos históricos expansíveis e comparação de clientes */
.grafico-painel{background:linear-gradient(180deg,#f7f9ff,#fff 45%);border:1px solid #dce1f1;border-top:0;border-radius:0 0 14px 14px;padding:20px;margin-top:-8px;box-shadow:0 12px 24px rgba(20,31,70,.06)}
.grafico-titulo{font-size:13px;font-weight:700;color:var(--azul);margin-bottom:8px}
.grafico-legenda{font-size:12px;color:var(--mute);margin-top:6px}
.grafico-svg{display:block;width:100%;height:auto;max-height:350px;filter:drop-shadow(0 6px 12px rgba(30,30,123,.05))}
.grafico-svg text{font-family:inherit;font-size:11px;fill:var(--mute)}
.grafico-svg .linha-grid{stroke:#E3E4E9;stroke-width:1}
.grafico-svg .serie{fill:none;stroke:var(--azul);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.grafico-svg .ponto{fill:var(--azul)}
.ferramentas{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.ferramentas label{font-size:13px;color:var(--mute)}
.ferramentas button,.grafico-painel button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:7px 10px;cursor:pointer;color:var(--azul);font-weight:600}
.comparar{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.comparar input{accent-color:var(--azul)}
.comparacao{margin-top:26px;margin-bottom:16px;background:linear-gradient(160deg,#f3f6ff,#fff 42%);border:1px solid #dce1f1;border-radius:16px;padding:24px;box-shadow:0 12px 32px rgba(20,31,70,.07)}
.comparacao h2{font-size:21px;margin:0 0 6px;color:var(--azul)}
.comparacao select{min-width:240px;max-width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.comparacao .legendas{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:8px 0}
.comparacao .legendas span{display:inline-flex;align-items:center;gap:5px}
.comparacao .legendas i{width:14px;height:3px;display:inline-block}
.card .indicador{font-size:12px;color:var(--azul);flex:none}
.vazio{background:var(--card);border:1px solid var(--line);padding:34px;
  text-align:center;color:var(--mute);font-size:14px}
.carregando{color:var(--mute);font-size:14px;padding:30px 0}
@media(max-width:640px){
  .grafico-painel,.comparacao{padding:10px}
  .card .indicador{order:3}
  .comparar{order:5;margin-left:auto}
  .wrap{padding:14px 12px 40px}
  /* titulo e seletor de semana na mesma linha, subtitulo logo abaixo,
     sem o vao que o layout de desktop (coluna + spacer + input) deixava
     antes do primeiro card. display:contents tira a div do fluxo do grid
     e deixa h1/.sub virarem itens do proprio header. */
  header{display:grid;grid-template-columns:1fr auto;
    grid-template-areas:"tit inp" "sub sub";column-gap:10px;row-gap:2px;
    align-items:center;margin-bottom:4px}
  header>div:first-child{display:contents}
  h1{grid-area:tit;font-size:18px}
  .sub{grid-area:sub;font-size:12px}
  .spacer{display:none}
  input[type=week]{grid-area:inp;justify-self:end;font-size:13px;padding:6px 8px}
  hr{margin:10px 0 14px}

  /* card em duas linhas: 1a com posicao, nome completo (pode quebrar) e o
     selo de variacao; 2a com as tres semanas dividindo a largura toda do
     card, sem cortar nenhuma coluna. order muda a ordem visual sem mexer
     no markup (.semanas continua depois de .var no DOM). */
  .card{flex-wrap:wrap;gap:6px 10px;padding:10px 12px}
  .card .pos{order:1;width:22px;font-size:12px}
  .card .nome{order:2;flex:1 1 auto;min-width:0;font-size:13.5px;
    line-height:1.25;white-space:normal;overflow:visible;text-overflow:clip}
  .card .var{order:3;flex:none;width:60px;font-size:11px;padding:3px 0}
  .card .semanas{order:4;flex:1 1 100%;width:100%;max-width:none;
    overflow-x:visible;gap:4px}
  .card .col{flex:1 1 0;width:auto;min-width:0}
  .card .col .rot{font-size:10px}
  .card .col .pr{font-size:12px}
  .card .col.atual .pr{font-size:14.5px}
  .card .col .dif{font-size:9px}
}
@media(min-width:901px){
  /* espaco de sobra entre o nome e o selo: a area das semanas cresce pra
     usar ele, em vez de ficar espremida em 60px enquanto o nome (flex:1)
     absorve tudo. nowrap garante que "R$ 6.600" fica numa linha so mesmo
     que uma cotacao futura tenha mais digitos. */
  .card .semanas{gap:22px}
  .card .col{width:90px}
  .card .col .pr{white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>Análise de cotações</h1>
    <p class="sub" id="sub">Carregando…</p>
  </div>
  <div class="spacer"></div>
  <input type="week" id="semana" aria-label="Semana">
</header>
<hr>

<div id="conteudo"><p class="carregando">Carregando…</p></div>
<section class="comparacao" aria-label="Comparativo de Mercado"><h2>Comparativo de Mercado</h2><p class="grafico-legenda">Selecione até 5 clientes para analisar a evolução das cotações. Passe o mouse sobre os pontos para consultar os valores.</p><div class="ferramentas"><label for="clienteComparar">Adicionar cliente</label><select id="clienteComparar" aria-label="Selecionar cliente para comparar"><option value="">Selecione um cliente</option></select><button type="button" id="adicionarComparacao">Adicionar</button><button type="button" id="limparComparacao">Limpar</button></div><div id="comparacao"></div></section>

</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const nf = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const rs = v => 'R$ ' + nf.format(v);
// Dentro do iframe do painel, navegar tem que trocar a pagina inteira.
// Aberta direto (sem casca), window.top e a propria janela.
function navTopo(url) { window.top.location.href = url; }
function sessaoExpirada(r) {
  if (r.status === 401) { navTopo('/entrar'); return true; }
  return false;
}

// Semana <-> valor de <input type="week"> (formato ISO "AAAA-Www").
// As colunas ano/semana da tabela cotacoes ja sao semana ISO (mesmo
// criterio de isoWeekInfo() em mapas.html), entao a conversao e direta.
const paraInput = w => w.ano + '-W' + String(w.semana).padStart(2, '0');
const doInput = v => {
  const m = /^(\d{4})-W(\d{2})$/.exec(v || '');
  return m ? { ano: Number(m[1]), semana: Number(m[2]) } : null;
};
const chave = w => w.ano + '/' + w.semana;

var HISTORICO_CACHE = null;
var HISTORICO_PROMESSA = null;
var EXPANDIDO = null;
var SELECIONADOS = new Set();
var LISTA_ATUAL = [];
var GERACAO = 0;
var SEMANAS = [];      // ordem crescente (ano,semana) — so as que tem cotacao

function achaIndice(w) {
  return SEMANAS.findIndex(s => s.ano === w.ano && s.semana === w.semana);
}

// Regime fiscal da linha, a partir do ICMS (fracao: 0.12 = 12%). ICMS zero
// (ou ausente, cotacao gravada antes desta coluna existir) e "diferido";
// qualquer aliquota positiva vira "com ICMS N%", usando o proprio valor no
// rotulo em vez de travar em 12% (pode aparecer outra aliquota).
function regimeDe(icms) {
  const v = Number(icms) || 0;
  if (v <= 0) return { chave: 'diferido', rotulo: 'diferido' };
  const pct = Math.round(v * 100);
  return { chave: 'icms' + pct, rotulo: 'com ICMS ' + pct + '%' };
}

// Melhor oferta (maior valor) por cliente E REGIME de ICMS, entre todas as
// origens da semana — a mesma cotacao pode ter varias linhas (uma por
// origem/unidade). Oferta bruta nao e comparavel entre regimes diferentes
// (o ICMS muda o preco liquido), entao cada regime disputa "melhor oferta"
// separado, nunca junto com outro regime do mesmo cliente.
function melhorPorClienteRegime(linhas) {
  const m = new Map();
  linhas.forEach(l => {
    const of = Number(l.oferta);
    if (!(of > 0)) return;
    // Ignora variacao de grafia: cliente e o texto cru da coluna, sem
    // normalizacao — "Rio Branco" escrito diferente em duas linhas conta
    // como dois clientes distintos. Fora do recorte desta versao.
    const reg = regimeDe(l.icms);
    const chaveLinha = l.cliente + ' ' + reg.chave;
    const atual = m.get(chaveLinha);
    if (!atual || of > atual.preco) {
      m.set(chaveLinha, { cliente: l.cliente, regimeChave: reg.chave, regimeRotulo: reg.rotulo, preco: of });
    }
  });
  return m;
}

function variacao(atual, antes) {
  if (antes == null) return { classe: 'ausente', texto: '' };
  const p = Math.round((atual - antes) / antes * 100);
  if (p === 0) return { classe: 'igual', texto: 'manteve' };
  return { classe: p > 0 ? 'alta' : 'baixa', texto: (p > 0 ? '+' : '') + p + '%' };
}

// Variacao em reais entre uma semana e a anterior (dentro da propria
// sequencia de 3 colunas — nao e a mesma conta de variacao(), que compara
// so a semana selecionada com a anterior). Sem preco de um dos dois lados
// (primeira coluna, ou cliente que nao cotou naquela semana), fica sem
// variacao: o espaco continua reservado (ver .dif no CSS), so sem texto.
function variacaoReais(atual, antes) {
  if (atual == null || antes == null) return { classe: 'ausente', texto: '' };
  const d = Math.round(atual - antes);
  if (d === 0) return { classe: 'igual', texto: 'R$ 0' };
  return { classe: d > 0 ? 'alta' : 'baixa', texto: (d > 0 ? '+R$ ' : '-R$ ') + nf.format(Math.abs(d)) };
}

// Uma coluna por semana do historico, mais antiga pra mais recente: rotulo
// em cima, preco no meio, variacao em reais embaixo (contra a coluna
// anterior DESTA sequencia). A ultima (semana selecionada) vem maior, em
// negrito, com "R$" no preco — as demais so o numero. Cliente sem cotacao
// naquela semana mostra "-" no preco, mantendo a coluna (alinhamento).
function colunaHtml(historico, i) {
  const h = historico[i];
  const antes = i > 0 ? historico[i - 1].preco : null;
  const dv = variacaoReais(h.preco, antes);
  const precoTxt = h.preco == null ? '-' : (h.atual ? rs(h.preco) : nf.format(h.preco));
  return '<div class="col' + (h.atual ? ' atual' : '') + '">' +
    '<div class="rot">' + esc(h.rotulo) + '</div>' +
    '<div class="pr">' + precoTxt + '</div>' +
    '<div class="dif ' + dv.classe + '">' + esc(dv.texto) + '</div>' +
    '</div>';
}

// Histórico completo usa a mesma API e a mesma regra comercial do ranking.
async function historicoCompleto() {
  if (HISTORICO_CACHE) return HISTORICO_CACHE;
  if (!HISTORICO_PROMESSA) {
    HISTORICO_PROMESSA = (async () => {
      const resultado = new Map();
      // Lotes limitados para evitar URLs grandes; uma requisição por lote, não por cliente.
      for (let i = 0; i < SEMANAS.length; i += 20) {
        const lote = SEMANAS.slice(i, i + 20);
        const linhas = await buscarVarias(lote);
        const grupos = agruparPorSemana(linhas);
        lote.forEach(w => resultado.set(chave(w), melhorPorClienteRegime(grupos.get(chave(w)) || [])));
      }
      HISTORICO_CACHE = resultado;
      return resultado;
    })().catch(e => { HISTORICO_PROMESSA = null; throw e; });
  }
  return HISTORICO_PROMESSA;
}
function pontosSerie(id, mapas) {
  const ate = achaIndice(doInput($('#semana').value));
  return SEMANAS.slice(0, ate + 1).map(w => {
    const registro = mapas.get(chave(w))?.get(id);
    return {rotulo:'S'+w.semana+'/'+String(w.ano).slice(-2), preco:registro ? registro.preco : null};
  });
}
const CORES = ['#1E1E7B','#0F7B40','#C31419','#B36A00','#7B39A5'];
function desenharGrafico(series) {
  const largura=940, altura=260, esq=72, dir=20, cima=20, baixo=45;
  const n=Math.max(1,...series.map(s=>s.pontos.length));
  const valores=series.flatMap(s=>s.pontos.map(p=>p.preco)).filter(v=>v!=null);
  if (!valores.length) return '<p class="grafico-legenda">Sem cotações históricas disponíveis.</p>';
  let minimo=Math.min(...valores), maximo=Math.max(...valores);
  const folga=Math.max((maximo-minimo)*.12,20); minimo-=folga; maximo+=folga;
  const x=i=>esq+(n===1?(largura-esq-dir)/2:i*(largura-esq-dir)/(n-1));
  const y=v=>cima+(maximo-v)*(altura-cima-baixo)/(maximo-minimo);
  let svg='<svg class="grafico-svg" viewBox="0 0 '+largura+' '+altura+'" role="img" aria-label="Evolução semanal das cotações">';
  for(let i=0;i<=4;i++){
    const v=minimo+(maximo-minimo)*i/4, yy=y(v);
    svg+='<line class="linha-grid" x1="'+esq+'" x2="'+(largura-dir)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(esq-8)+'" y="'+(yy+4)+'" text-anchor="end">'+nf.format(v)+'</text>';
  }
  const labels=series[0].pontos;
  const passo=Math.max(1,Math.ceil(labels.length/9));
  labels.forEach((p,i)=>{if(i%passo===0||i===labels.length-1) svg+='<text x="'+x(i)+'" y="'+(altura-13)+'" text-anchor="middle">'+esc(p.rotulo)+'</text>';});
  series.forEach((s,si)=>{
    let trecho=[];
    const descarregar=()=>{if(trecho.length){svg+='<polyline class="serie" stroke="'+CORES[si%CORES.length]+'" style="stroke:'+CORES[si%CORES.length]+'" points="'+trecho.join(' ')+'"/>';trecho=[];}};
    s.pontos.forEach((p,i)=>{if(p.preco==null){descarregar();return;}trecho.push(x(i)+','+y(p.preco));});
    descarregar();
    s.pontos.forEach((p,i)=>{if(p.preco!=null)svg+='<circle cx="'+x(i)+'" cy="'+y(p.preco)+'" r="3.2" fill="'+CORES[si%CORES.length]+'"><title>'+esc(s.nome)+' · '+esc(p.rotulo)+' · '+rs(p.preco)+'</title></circle>';});
  });
  return svg+'</svg>';
}
async function atualizarGraficos() {
  const geracao=GERACAO;
  const painel=$('#graficoAberto'), comparacao=$('#comparacao');
  if (!painel && !SELECIONADOS.size) {comparacao.innerHTML='<p class="grafico-legenda">Adicione clientes para visualizar o comparativo.</p>';return;}
  if(painel) painel.innerHTML='<div class="grafico-legenda">Carregando histórico…</div>';
  if(SELECIONADOS.size) comparacao.innerHTML='<p class="grafico-legenda">Carregando comparação…</p>';
  try{
    const mapas=await historicoCompleto();
    if(geracao!==GERACAO)return;
    const escolhidos=LISTA_ATUAL.filter(x=>SELECIONADOS.has(x.id));
    if(comparacao)comparacao.innerHTML=escolhidos.length?'<div class="grafico-legenda">Valores brutos por semana. Regimes de ICMS distintos não são equivalentes.</div>'+desenharGrafico(escolhidos.map(x=>({nome:x.nome,pontos:pontosSerie(x.id,mapas)})))+'<div class="legendas">'+escolhidos.map((x,i)=>'<span><i style="background:'+CORES[i]+'"></i>'+esc(x.nome)+'</span>').join('')+'</div>':'<p class="grafico-legenda">Adicione clientes para visualizar o comparativo.</p>';
    if(painel&&EXPANDIDO){
      const item=LISTA_ATUAL.find(x=>x.id===EXPANDIDO);
      if(item) painel.innerHTML='<div class="grafico-titulo">Histórico de cotações · '+esc(item.nome)+'</div>'+desenharGrafico([{nome:item.nome,pontos:pontosSerie(item.id,mapas).slice(-4)}])+'<div class="grafico-legenda">Maior oferta bruta por cliente e regime em cada semana. Ausência de cotação interrompe a linha.</div>';
    }
  }catch(e){if(painel)painel.textContent='Não foi possível carregar o histórico.';if(comparacao&&SELECIONADOS.size)comparacao.textContent='Não foi possível carregar a comparação.';}
}
function renderRanking(lista) {
  LISTA_ATUAL=lista;
  const seletor=$('#clienteComparar');
  if(seletor) seletor.innerHTML='<option value="">Selecione um cliente</option>'+lista.filter(x=>!SELECIONADOS.has(x.id)).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.nome)+'</option>').join('');
  const box = $('#conteudo');
  if (!lista.length) {
    box.innerHTML = '<div class="vazio">Nenhuma cotação nesta semana.</div>';
    $('#comparacao').innerHTML='<p class="grafico-legenda">Sem cotações disponíveis nesta semana.</p>';
    return;
  }
  box.innerHTML = '<div class="rank">' + lista.map((x, i) => {
    const v = variacao(x.preco, x.anterior);
    const cols = x.historico.map((_, hi) => colunaHtml(x.historico, hi)).join('');
    const aberto=EXPANDIDO===x.id;
    return '<div class="card" role="button" tabindex="0" aria-expanded="'+aberto+'" data-id="'+esc(x.id)+'">' +
      '<div class="pos">' + (i + 1) + 'º</div>' +
      '<div class="nome" title="'+esc(x.nome)+'">' + esc(x.nome) + '</div>' +
      '<div class="semanas">' + cols + '</div>' +
      '<div class="var ' + v.classe + '">' + esc(v.texto) + '</div>' +
      '<span class="indicador" aria-hidden="true">'+(aberto?'▴':'▾')+'</span>' +

      '</div>'+(aberto?'<div class="grafico-painel" id="graficoAberto"></div>':'');
  }).join('') + '</div>';
  atualizarGraficos();
}
$('#conteudo').addEventListener('click',e=>{
  const card=e.target.closest('.card[data-id]');
  if(!card)return;
  EXPANDIDO=EXPANDIDO===card.dataset.id?null:card.dataset.id;
  renderRanking(LISTA_ATUAL);
});
$('#conteudo').addEventListener('keydown',e=>{
  if(e.target.matches('.card')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}
});
$('#limparComparacao').onclick=()=>{SELECIONADOS.clear();renderRanking(LISTA_ATUAL);};
$('#adicionarComparacao').onclick=()=>{const id=$('#clienteComparar').value;if(!id)return;if(SELECIONADOS.size>=5){alert('Selecione no máximo 5 clientes.');return;}SELECIONADOS.add(id);renderRanking(LISTA_ATUAL);};
// Linhas cruas de varias semanas de uma vez, numa unica ida ao banco
// (db.js:cotacoesDeSemanas) — nunca uma consulta por semana, e muito menos
// por cliente.
async function buscarVarias(semanas) {
  if (!semanas.length) return [];
  const q = semanas.map(s => s.ano + '-' + s.semana).join(',');
  const r = await fetch('/api/cotacoes/varias?pares=' + encodeURIComponent(q));
  if (sessaoExpirada(r)) return [];
  if (!r.ok) return [];
  return r.json();
}

function agruparPorSemana(linhas) {
  const m = new Map();
  linhas.forEach(l => {
    const k = chave(l);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(l);
  });
  return m;
}

async function carregarSemana(w) {
  const geracao=++GERACAO;
  EXPANDIDO=null;
  SELECIONADOS.clear();
  $('#sub').textContent = 'Semana ' + w.semana + '/' + w.ano + ' · carregando…';
  const idx = achaIndice(w);
  const anterior = idx > 0 ? SEMANAS[idx - 1] : null;

  // ate 3 semanas rastreadas ate a selecionada (a propria semana e as duas
  // anteriores que existirem no historico) — a primeira semana da base tem
  // so ela mesma, a segunda tem duas, da terceira em diante tem as tres.
  const alvo = [];
  for (let i = Math.max(0, idx - 2); i <= idx; i++) alvo.push(SEMANAS[i]);

  const linhas = await buscarVarias(alvo);
  if(geracao!==GERACAO)return;
  const porSemana = agruparPorSemana(linhas);
  // mesmo criterio de sempre por semana: a melhor oferta (maior valor) por
  // cliente E REGIME, entre as origens daquela semana.
  const mapas = alvo.map(s => melhorPorClienteRegime(porSemana.get(chave(s)) || []));
  const mAtual = mapas[mapas.length - 1];
  const mAnterior = mapas.length > 1 ? mapas[mapas.length - 2] : new Map();

  // rotulo do regime so aparece quando o cliente tem mais de um regime
  // nesta semana — cliente com um regime so continua com uma linha, sem
  // sufixo (mesmo texto de antes).
  const regimesPorCliente = new Map();
  mAtual.forEach(v => regimesPorCliente.set(v.cliente, (regimesPorCliente.get(v.cliente) || 0) + 1));

  const lista = [...mAtual.entries()]
    .map(([chaveLinha, info]) => {
      const anteriorInfo = mAnterior.get(chaveLinha);
      return {
        id: chaveLinha,
        nome: info.cliente + (regimesPorCliente.get(info.cliente)>1 ? " · "+info.regimeRotulo : ""),
        cliente: info.cliente,
        regimeRotulo: regimesPorCliente.get(info.cliente) > 1 ? info.regimeRotulo : null,
        preco: info.preco,
        anterior: anteriorInfo ? anteriorInfo.preco : null,
        // mesma chave (cliente+regime) em cada semana do historico — se o
        // cliente nao ofertou NESTE regime naquela semana (ofertou noutro,
        // ou nao ofertou nada), a coluna fica sem preco ("-", sem variacao).
        historico: alvo.map((s, i) => {
          const h = mapas[i].get(chaveLinha);
          return { rotulo: 'S' + s.semana, preco: h ? h.preco : null, atual: i === alvo.length - 1 };
        })
      };
    })
    .sort((a, b) => b.preco - a.preco);

  const nClientes = regimesPorCliente.size;
  const nLinhas = lista.length;
  const txtClientes = nClientes + (nClientes === 1 ? ' cliente cotou' : ' clientes cotaram');
  const txtLinhas = nLinhas !== nClientes ? (' em ' + nLinhas + (nLinhas === 1 ? ' linha' : ' linhas')) : '';
  $('#sub').textContent = 'Semana ' + w.semana + '/' + w.ano + ' · ' + txtClientes + txtLinhas +
    (anterior ? ' · comparado com a semana ' + anterior.semana + '/' + anterior.ano : '');
  renderRanking(lista);
}

$('#semana').onchange = () => {
  const w = doInput($('#semana').value);
  if (!w || achaIndice(w) < 0) {
    $('#sub').textContent = w ? 'Sem cotação nessa semana.' : '';
    $('#conteudo').innerHTML = '<div class="vazio">Sem cotação nessa semana. ' +
      'Escolha uma das semanas com dado (destacadas no seletor).</div>';
    return;
  }
  carregarSemana(w);
};

async function iniciar() {
  const r = await fetch('/api/cotacoes/semanas');
  if (sessaoExpirada(r)) return;
  const j = r.ok ? await r.json() : [];
  // API devolve DESC (mais recente primeiro); aqui a ordem crescente e
  // o que interessa, pra achar "a semana anterior" andando um indice atras.
  SEMANAS = j.slice().reverse();
  if (!SEMANAS.length) {
    $('#sub').textContent = '';
    $('#semana').disabled = true;
    $('#conteudo').innerHTML = '<div class="vazio">Nenhuma cotação gravada ainda. ' +
      'Suba um Mapa em "Cotações do Mapa" primeiro.</div>';
    return;
  }
  const ultima = SEMANAS[SEMANAS.length - 1];
  $('#semana').min = paraInput(SEMANAS[0]);
  $('#semana').max = paraInput(ultima);
  $('#semana').value = paraInput(ultima);
  await carregarSemana(ultima);
}

iniciar();

// Aberta dentro do iframe do painel: avisa a propria altura toda vez que o
// conteudo muda (troca de semana, carregamento), pra secao do painel
// crescer junto e nunca precisar de rolagem propria.
if (window.parent !== window) {
  (function () {
    function enviarAltura() {
      window.parent.postMessage(
        { tipo: 'alturaFrame', secao: 'analise', altura: document.documentElement.scrollHeight },
        location.origin
      );
    }
    new ResizeObserver(enviarAltura).observe(document.body);
    window.addEventListener('load', enviarAltura);
  })();
}
</script>
